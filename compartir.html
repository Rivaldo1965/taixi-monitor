<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Compartir ubicación — TAiXI Monitor</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, sans-serif; background: #f3f4f6; }
  .card {
    max-width: 520px; margin: 24px auto; background: #fff; border-radius: 18px;
    padding: 22px; box-shadow: 0 4px 18px rgba(0,0,0,.12); text-align: center;
  }
  h1 { font-size: 24px; margin: 0 0 10px; }
  p { font-size: 17px; line-height: 1.45; }
  button {
    width: 100%; padding: 16px; border: 0; border-radius: 12px;
    background: #16a34a; color: #fff; font-size: 19px; font-weight: 700; margin-top: 12px;
  }
  button.stop { background: #dc2626; display: none; }
  .status { margin-top: 14px; font-size: 16px; font-weight: 700; }
  .small { font-size: 14px; color: #4b5563; }
</style>
</head>
<body>
<div class="card">
  <h1>TAiXI Monitor</h1>
  <p id="intro">Toca el botón y acepta el permiso de ubicación. Tu ubicación se comparte solo mientras esta página esté abierta.</p>
  <button id="start">Compartir mi ubicación</button>
  <button id="stop" class="stop">Detener</button>
  <div class="status" id="status"></div>
  <p class="small">Mantén esta página abierta y el teléfono cargando mientras trabajas. Si bloqueas la pantalla, el envío puede pausarse.</p>
</div>

<script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
<script>
  const BROKER = "wss://broker.hivemq.com:8884/mqtt";
  const params = new URLSearchParams(location.hash.replace(/^#/, ""));
  const channel = params.get("c") || "";
  const code = params.get("d") || "";
  const keyText = params.get("k") || "";

  const statusEl = document.getElementById("status");
  const startBtn = document.getElementById("start");
  const stopBtn = document.getElementById("stop");
  let client = null;
  let watchId = null;
  let lastSent = 0;
  let wakeLock = null;

  function unb64u(str) {
    str = str.replace(/-/g, "+").replace(/_/g, "/");
    while (str.length % 4) str += "=";
    const s = atob(str);
    const a = new Uint8Array(s.length);
    for (let i = 0; i < s.length; i++) a[i] = s.charCodeAt(i);
    return a;
  }
  function b64u(bytes) {
    let s = "";
    bytes.forEach(b => { s += String.fromCharCode(b); });
    return btoa(s).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
  }

  if (!channel || !code || !keyText) {
    document.getElementById("intro").textContent = "Este enlace no está completo. Pide a Rivaldo que te envíe tu enlace personal otra vez.";
    startBtn.style.display = "none";
  }

  async function encryptPos(pos) {
    const key = await crypto.subtle.importKey("raw", unb64u(keyText), { name: "AES-GCM" }, false, ["encrypt"]);
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const data = new TextEncoder().encode(JSON.stringify(pos));
    const ct = await crypto.subtle.encrypt({ name: "AES-GCM", iv }, key, data);
    return JSON.stringify({ v: 1, iv: b64u(iv), ct: b64u(new Uint8Array(ct)) });
  }

  async function sendPos(position) {
    const now = Date.now();
    if (now - lastSent < 15000) return;
    lastSent = now;
    const pos = {
      lat: position.coords.latitude,
      lng: position.coords.longitude,
      t: now
    };
    try {
      const payload = await encryptPos(pos);
      client.publish("taixi-monitor/" + channel + "/" + code, payload);
      statusEl.textContent = "Compartiendo tu ubicación · " + new Date(now).toLocaleTimeString();
    } catch (e) {
      statusEl.textContent = "No se pudo enviar la ubicación. Revisa tu conexión.";
    }
  }

  function geoError(err) {
    if (err.code === 1) statusEl.textContent = "Permiso de ubicación denegado. Actívalo para esta página e inténtalo otra vez.";
    else statusEl.textContent = "No se pudo obtener tu ubicación. Revisa que el GPS esté activado.";
  }

  startBtn.addEventListener("click", () => {
    if (!("geolocation" in navigator)) {
      statusEl.textContent = "Este teléfono no permite compartir ubicación desde el navegador.";
      return;
    }
    statusEl.textContent = "Conectando…";
    client = mqtt.connect(BROKER, { clientId: "taixi-driver-" + code + "-" + Math.random().toString(16).slice(2, 8), reconnectPeriod: 5000 });
    client.on("connect", async () => {
      statusEl.textContent = "Conectado. Buscando tu ubicación…";
      startBtn.style.display = "none";
      stopBtn.style.display = "block";
      try { wakeLock = await navigator.wakeLock.request("screen"); } catch (e) { /* sin wake lock */ }
      watchId = navigator.geolocation.watchPosition(sendPos, geoError, {
        enableHighAccuracy: true,
        maximumAge: 10000,
        timeout: 20000
      });
    });
    client.on("error", () => { statusEl.textContent = "Sin conexión. Revisa tu internet."; });
  });

  stopBtn.addEventListener("click", () => {
    if (watchId !== null) navigator.geolocation.clearWatch(watchId);
    if (client) client.end();
    if (wakeLock) wakeLock.release();
    watchId = null;
    client = null;
    stopBtn.style.display = "none";
    startBtn.style.display = "block";
    statusEl.textContent = "Ubicación detenida.";
  });

  document.addEventListener("visibilitychange", () => {
    if (document.hidden && watchId !== null) {
      statusEl.textContent = "La página quedó en segundo plano: el envío puede pausarse hasta volver.";
    }
  });
</script>
</body>
</html>
